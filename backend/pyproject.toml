[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "questline-backend"
version = "0.1.0"
description = "Questline trip-planning API and background worker"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.15,<2",
  "procrastinate==3.10.0",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "pyright>=1.1.400,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/questline"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a disposable PostgreSQL database via TEST_DATABASE_URL"]
