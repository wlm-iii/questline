name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: questline
          POSTGRES_PASSWORD: questline
          POSTGRES_DB: questline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U questline -d questline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://questline:questline@localhost:5432/questline_test
      TEST_DATABASE_URL: postgresql://questline:questline@localhost:5432/questline_test
      APP_ENV: test
      API_TOKEN: local-development-only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Check migration round trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest -q
      - run: uv run alembic check
